# ==============================================================================
# GRAFANA DEPLOYMENT - For metrics visualization
# ==============================================================================
# Deploys Grafana for creating dashboards from Prometheus metrics
#
# APPLY COMMANDS:
#   kubectl create namespace monitoring
#   kubectl apply -f grafana/grafana-deployment.yaml
#
# ACCESS:
#   http://<node-ip>:32000
#   Default login: admin / admin
#
# SETUP:
#   1. Login to Grafana
#   2. Add Prometheus data source: http://prometheus-service:9090
#   3. Import dashboards or create your own
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          
          # Environment variables for initial setup
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin123"  # Change this in production! bez this  is default password for Grafana admin user, so make sure to change it in production for security reasons.
          
          # Persist Grafana data
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
          
          # Resource limits
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      
      volumes:
        - name: grafana-storage
          emptyDir: {}  # For demo; use PersistentVolume in production

---
# ==============================================================================
# GRAFANA SERVICE - Expose Grafana UI
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 32000  # Access via http://<node-ip>:32000
  type: NodePort